<!DOCTYPE html>
<html>
<head>
    <title>My Form</title>
</head>
<body>

    <h1>Student Form</h1>
    <p>Please fill your details</p>

    <form action="post">
        <div>
            <label for="name">Name</label>
            <input id="name" type="text" placeholder="Enter your name" required>
        </div>
        <br>
        <div>
            <label for="city">City</label>
            <input id="city" type="text" placeholder="Enter your city name" required>
        </div>
        <br>
        <div>
            <label for="pincode">Pincode</label>
            <input id="pincode" type="password" placeholder="Enter your Pincode" required>
        </div>
        <br>
        <div>
            <button type="submit">Submit</button>
        </div>
    </form>

</body>
  </html>
